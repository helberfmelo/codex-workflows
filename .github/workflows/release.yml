name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. 1.2.0)"
        required: true
      push_changes:
        description: "Push commit and tag to origin"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-from-dispatch:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and test
        run: |
          python scripts/ci_validate_skill.py --skills-root skills
          python -m unittest discover -s tests -p "test_*.py"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut release
        run: python scripts/release_automation.py --version "${{ inputs.version }}" --apply --commit --tag --notes-out "${{ runner.temp }}/release-notes.md"

      - name: Push commit and tag
        if: ${{ inputs.push_changes == 'true' }}
        run: |
          git push origin HEAD
          git push origin "v${{ inputs.version }}"

      - name: Publish GitHub Release
        if: ${{ inputs.push_changes == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md

  publish-from-tag:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve release notes path
        id: notes
        shell: bash
        run: |
          NOTES_PATH="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${NOTES_PATH}" ]]; then
            NOTES_PATH="CHANGELOG.md"
          fi
          echo "path=${NOTES_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release from tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}

  publish-npm-from-tag:
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Tag version (${TAG_VERSION}) does not match package.json (${PACKAGE_VERSION})."
            exit 1
          fi

      - name: Warn when NPM_TOKEN is missing
        if: ${{ env.NODE_AUTH_TOKEN == '' }}
        run: echo "::warning::NPM_TOKEN is not configured. npm publish was skipped."

      - name: Publish npm package
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: npm publish --access public
